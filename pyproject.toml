[project]
name = "synthetic-data-generator-agent"
version = "0.1.0"
description = "Generate realistic, referentially consistent synthetic data from ODCS data contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai[anthropic,google-genai]>=0.80.0",
    "datacontract-cli>=0.10.0",
    "duckdb>=0.10.0",
    "faker>=24.0.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]

[tool.uv]
package = false
